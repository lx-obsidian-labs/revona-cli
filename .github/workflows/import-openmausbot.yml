name: Import OpenMausBot foundation
on:
  push:
    branches: [import/openmausbot-base]
    paths: ['.github/workflows/import-openmausbot.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Clone upstream
        run: git clone --depth 1 https://github.com/milind-soni/OpenMausBot.git /tmp/openmausbot
      - name: Import source preserving destination Git history
        shell: bash
        run: |
          set -euo pipefail
          # The default GITHUB_TOKEN cannot create/update workflow files.
          # Keep our workflow definitions and exclude upstream workflows.
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' /tmp/openmausbot/ ./
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Import OpenMausBot source excluding upstream workflows'
          git push origin HEAD:import/openmausbot-base
