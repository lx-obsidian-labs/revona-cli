name: Revona foundation verification
on:
  push:
    branches: [import/openmausbot-base]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Revona branded desktop and web icons
        run: node scripts/generate-revona-artwork.mjs
      - name: Release identity and licensing audit (report only)
        run: node scripts/revona-release-audit.mjs
      - name: Revona packaging and update policy tests
        run: node --test scripts/revona-builder.node-test.mjs electron/revona-update-policy.node-test.mjs
      - name: Structural baseline
        run: node scripts/revona-baseline.mjs
      - name: Revona credential boundary tests
        run: pnpm exec vitest run server/revona/credential-boundary.test.ts
      - name: Typecheck
        run: pnpm typecheck
      - name: Electron syntax
        run: pnpm check:electron
      - name: Production build
        run: pnpm build
      - name: Electron tests
        run: pnpm test:electron
